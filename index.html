<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TCB Music Player</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #181818;
      padding: 20px;
      border-radius: 16px;
      width: 340px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #282828;
      color: #fff;
    }
    button {
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      background: #1db954;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #1ed760; }
    
    .results-list {
      max-height: 180px;
      overflow-y: auto;
      margin-bottom: 12px;
      background: #222;
      border-radius: 8px;
      display: none;
      text-align: left;
    }
    .result-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      cursor: pointer;
      border-bottom: 1px solid #333;
    }
    .result-item:hover { background: #333; }
    .result-item img { width: 45px; height: 35px; border-radius: 4px; object-fit: cover; }
    .result-title { font-size: 12px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .thumbnail {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 12px;
      background: #282828;
      margin-bottom: 10px;
    }
    .controls { display: flex; justify-content: center; gap: 12px; margin: 12px 0; }
    .progress-container, .volume-container { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #aaa; margin-top: 8px; }
    input[type="range"] { flex: 1; accent-color: #1db954; cursor: pointer; }
    
    /* Hidden Audio Stream Container */
    #audio-container { display: none; }
  </style>
</head>
<body>

  <div class="card">
    <div class="search-box">
      <input type="text" id="query" placeholder="Search song or paste link..." onkeydown="if(event.key==='Enter') handleInput()">
      <button onclick="handleInput()">Search</button>
    </div>

    <div id="results" class="results-list"></div>

    <img id="coverArt" class="thumbnail" src="https://via.placeholder.com/320x200/282828/FFFFFF?text=Search+or+Paste+Link" alt="Cover">
    <div id="trackTitle" style="font-size: 14px; font-weight: bold; margin: 6px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">No Song Selected</div>

    <div class="controls">
      <button onclick="togglePlay()" id="playBtn">▶ Play</button>
    </div>

    <div class="progress-container">
      <span id="currentTime">0:00</span>
      <input type="range" id="seekBar" value="0" max="100" onchange="seekAudio(this.value)">
      <span id="duration">0:00</span>
    </div>

    <div class="volume-container">
      <span>🔊</span>
      <input type="range" id="volumeBar" value="100" max="100" onchange="setVolume(this.value)">
    </div>
  </div>

  <div id="audio-container"></div>

  <script>
    let audio = new Audio();
    const playBtn = document.getElementById('playBtn');

    // CORS proxy wrapper to prevent browser security blocks
    const CORS_PROXY = "https://corsproxy.io/?";
    const INVIDIOUS_INSTANCE = "https://yewtu.be";

    async function handleInput() {
      const q = document.getElementById('query').value.trim();
      const resultsDiv = document.getElementById('results');
      if (!q) return;

      // Check if user pasted a YouTube URL or direct ID
      let videoId = "";
      if (q.includes('v=')) videoId = q.split('v=')[1].split('&')[0];
      else if (q.includes('youtu.be/')) videoId = q.split('youtu.be/')[1].split('?')[0];
      else if (q.length === 11 && !q.includes(' ')) videoId = q;

      if (videoId) {
        resultsDiv.style.display = "none";
        playSong(videoId, "Loaded Track");
        return;
      }

      // Perform search via CORS Proxy
      resultsDiv.style.display = "block";
      resultsDiv.innerHTML = "<div style='padding:10px; font-size:12px;'>Searching songs...</div>";

      try {
        const searchUrl = `${CORS_PROXY}${encodeURIComponent(`${INVIDIOUS_INSTANCE}/api/v1/search?q=${encodeURIComponent(q)}&type=video`)}`;
        const res = await fetch(searchUrl);
        const data = await res.json();

        if (!data || data.length === 0) {
          resultsDiv.innerHTML = "<div style='padding:10px; font-size:12px;'>No songs found. Try a different term.</div>";
          return;
        }

        resultsDiv.innerHTML = "";
        data.slice(0, 6).forEach(item => {
          const div = document.createElement('div');
          div.className = 'result-item';
          div.onclick = () => {
            resultsDiv.style.display = "none";
            playSong(item.videoId, item.title);
          };
          div.innerHTML = `
            <img src="https://img.youtube.com/vi/${item.videoId}/hqdefault.jpg">
            <div class="result-title">${item.title}</div>
          `;
          resultsDiv.appendChild(div);
        });
      } catch (err) {
        resultsDiv.innerHTML = "<div style='padding:10px; font-size:12px; color:#ff5555;'>Search blocked. Paste full YouTube URL instead.</div>";
      }
    }

    function playSong(id, title) {
      document.getElementById('trackTitle').innerText = title;
      document.getElementById('coverArt').src = `https://img.youtube.com/vi/${id}/hqdefault.jpg`;

      // Bypasses YouTube ads by routing through direct Invidious audio streams
      audio.src = `${CORS_PROXY}${encodeURIComponent(`${INVIDIOUS_INSTANCE}/latest_version?id=${id}&italic=true`)}`;
      audio.play().then(() => {
        playBtn.innerText = "⏸ Pause";
      }).catch(err => {
        // Fallback stream route if proxy fails
        audio.src = `https://yewtu.be/latest_version?id=${id}&italic=true`;
        audio.play();
        playBtn.innerText = "⏸ Pause";
      });
    }

    function togglePlay() {
      if (!audio.src) return;
      if (audio.paused) {
        audio.play();
        playBtn.innerText = "⏸ Pause";
      } else {
        audio.pause();
        playBtn.innerText = "▶ Play";
      }
    }

    function setVolume(val) { audio.volume = val / 100; }
    function seekAudio(val) { if (audio.duration) audio.currentTime = (audio.duration * val) / 100; }

    audio.ontimeupdate = () => {
      if (audio.duration) {
        document.getElementById('seekBar').value = (audio.currentTime / audio.duration) * 100;
        document.getElementById('currentTime').innerText = formatTime(audio.currentTime);
        document.getElementById('duration').innerText = formatTime(audio.duration);
      }
    };

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }
  </script>
</body>
</html>
