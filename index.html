<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Audio Music Player</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .player-card {
      background: #181818;
      padding: 24px;
      border-radius: 16px;
      width: 320px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #282828;
      color: #fff;
    }
    button {
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      background: #1db954;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #1ed760; }
    .thumbnail {
      width: 100%;
      height: 240px;
      object-fit: cover;
      border-radius: 12px;
      background: #282828;
      margin-bottom: 12px;
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 15px 0;
    }
    .progress-container, .volume-container {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #aaa;
      margin-top: 8px;
    }
    input[type="range"] {
      flex: 1;
      accent-color: #1db954;
      cursor: pointer;
    }
    /* Completely hide the YouTube Video Frame */
    #hidden-player {
      display: none;
    }
  </style>
</head>
<body>

  <div class="player-card">
    <!-- Search / URL Input -->
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Paste YouTube link or Video ID...">
      <button onclick="loadMedia()">Load</button>
    </div>

    <!-- Album Art / Thumbnail -->
    <img id="coverArt" class="thumbnail" src="https://via.placeholder.com/320x240/282828/FFFFFF?text=No+Track+Loaded" alt="Album Cover">
    
    <h3 id="trackTitle" style="margin: 8px 0; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">No Audio Playing</h3>

    <!-- Custom Audio Controls -->
    <div class="controls">
      <button onclick="playAudio()">▶ Play</button>
      <button onclick="pauseAudio()">⏸ Pause</button>
    </div>

    <!-- Seek Bar -->
    <div class="progress-container">
      <span id="currentTime">0:00</span>
      <input type="range" id="seekBar" value="0" max="100" onchange="seekAudio(this.value)">
      <span id="duration">0:00</span>
    </div>

    <!-- Volume Bar -->
    <div class="volume-container">
      <span>🔊</span>
      <input type="range" id="volumeBar" value="100" max="100" onchange="setVolume(this.value)">
    </div>
  </div>

  <!-- Hidden YouTube API Frame -->
  <div id="hidden-player"></div>

  <script>
    let player;
    let updateInterval;

    // Load YouTube IFrame API
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('hidden-player', {
        height: '0',
        width: '0',
        playerVars: {
          'autoplay': 0,
          'controls': 0
        },
        events: {
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function loadMedia() {
      const input = document.getElementById('searchInput').value.trim();
      let videoId = input;

      if (input.includes('v=')) {
        videoId = input.split('v=')[1].split('&')[0];
      } else if (input.includes('youtu.be/')) {
        videoId = input.split('youtu.be/')[1].split('?')[0];
      }

      if (videoId && player) {
        // Load thumbnail automatically
        document.getElementById('coverArt').src = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
        document.getElementById('trackTitle').innerText = "Loading Track...";
        
        player.loadVideoById(videoId);
      }
    }

    function playAudio() { if (player) player.playVideo(); }
    function pauseAudio() { if (player) player.pauseVideo(); }
    
    function setVolume(val) {
      if (player) player.setVolume(val);
    }

    function seekAudio(val) {
      if (player) {
        const seekToTime = (player.getDuration() * val) / 100;
        player.seekTo(seekToTime, true);
      }
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        document.getElementById('trackTitle').innerText = player.getVideoData().title || "Playing Audio";
        startProgressLoop();
      } else {
        clearInterval(updateInterval);
      }
    }

    function startProgressLoop() {
      clearInterval(updateInterval);
      updateInterval = setInterval(() => {
        if (player && player.getCurrentTime) {
          const current = player.getCurrentTime();
          const total = player.getDuration();
          if (total > 0) {
            document.getElementById('seekBar').value = (current / total) * 100;
            document.getElementById('currentTime').innerText = formatTime(current);
            document.getElementById('duration').innerText = formatTime(total);
          }
        }
      }, 1000);
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }
  </script>
</body>
</html>
